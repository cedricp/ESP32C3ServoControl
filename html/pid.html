<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Flight Controller - Configuration PID</title>
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #1e2228;
            --accent: #0088ff;
            --accent-hover: #0066cc;
            --text: #e0e6ed;
            --text-dim: #8a99a8;
            --border: #2e3440;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 { margin: 0 0 5px 0; font-size: 1.5rem; color: #fff; }
        p.subtitle { margin: 0; color: var(--text-dim); font-size: 0.9rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 10px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-dim);
        }

        .control-label span.val {
            color: #fff;
            font-weight: bold;
            font-family: monospace;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        nav.navbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 25px; /* Espace sous le menu */
        }

        .checkbox-group {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed var(--border); /* Séparateur discret */
        }

        .checkbox-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
        }

        .checkbox-label input[type=checkbox] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent); /* Reprend la couleur bleue du theme */
            cursor: pointer;
        }

        .select-input {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color, #121417);
            color: var(--text, #e0e6ed);
            border: 1px solid var(--border, #2e3440);
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            margin-top: 6px;
            transition: border-color 0.2s ease;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: #444; cursor: not-allowed; }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            height: 20px;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
    </style>
</head>
<body>

<div class="container">

    <nav class="navbar">
        <a href="/" class="active">PID Settings</a>
        <a href="/output">Outputs</a>
        <a href="/wifi">Wi-Fi & NVS</a>
    </nav>

    <header>
        <h1>PID & Rates Settings</h1>
        <p class="subtitle">ESP32-C3 Flight Controller</p>
    </header>

    <form id="gainsChannel">   
        <div class="card">
            <h2>Master Gain</h2>
            <div class="control-group">
                <div class="control-label">
                    <span>Master gain channel input</span>
                </div>
                
                <select id="master_gain" class="select-input">
                    <option value="0">Channel 0</option>
                    <option value="1">Channel 1</option>
                    <option value="2">Channel 2</option>
                    <option value="3">Channel 3</option>
                    <option value="4">Channel 4</option>
                    <option value="5">Channel 5</option>
                    <option value="6">Channel 6</option>
                    <option value="7">Channel 7</option>
                </select>
            </div>
        </div>
    </form>

    <form id="pidForm">
        <div class="grid">
            <div class="card">
                <h2>Roll</h2>
                <div class="control-group">
                    <div class="control-label"><span>Kp</span><span class="val" id="roll_kp_v">0.00</span></div>
                    <input type="range" id="roll_kp" min="0" max="3" step="0.01" value="0.80">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Kd</span><span class="val" id="roll_kd_v">0.0000</span></div>
                    <input type="range" id="roll_kd" min="0" max="0.5" step="0.005" value="0.050">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Max Rate (°/s)</span><span class="val" id="roll_rate_v">250</span></div>
                    <input type="range" id="roll_rate" min="50" max="500" step="10" value="250">
                </div>

                <div class="control-group checkbox-group">
                    <label for="roll_invert" class="checkbox-label">
                        <span>Invert</span>
                        <input type="checkbox" id="roll_invert">
                    </label>
                </div>
            </div>

            <div class="card">
                <h2>Pitch</h2>
                <div class="control-group">
                    <div class="control-label"><span>Kp</span><span class="val" id="pitch_kp_v">0.00</span></div>
                    <input type="range" id="pitch_kp" min="0" max="3" step="0.01" value="0.80">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Kd</span><span class="val" id="pitch_kd_v">0.0000</span></div>
                    <input type="range" id="pitch_kd" min="0" max="0.5" step="0.005" value="0.050">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Max Rate (°/s)</span><span class="val" id="pitch_rate_v">150</span></div>
                    <input type="range" id="pitch_rate" min="50" max="500" step="10" value="150">
                </div>

                <div class="control-group checkbox-group">
                    <label for="pitch_invert" class="checkbox-label">
                        <span>Invert</span>
                        <input type="checkbox" id="pitch_invert">
                    </label>
                </div>
            </div>

            <div class="card">
                <h2>Yaw</h2>
                <div class="control-group">
                    <div class="control-label"><span>Kp</span><span class="val" id="yaw_kp_v">0.00</span></div>
                    <input type="range" id="yaw_kp" min="0" max="3" step="0.01" value="1.00">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Kd</span><span class="val" id="yaw_kd_v">0.0000</span></div>
                    <input type="range" id="yaw_kd" min="0" max="0.5" step="0.005" value="0.0000">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Max Rate (°/s)</span><span class="val" id="yaw_rate_v">120</span></div>
                    <input type="range" id="yaw_rate" min="50" max="500" step="10" value="120">
                </div>

                <div class="control-group checkbox-group">
                    <label for="yaw_invert" class="checkbox-label">
                        <span>Invert</span>
                        <input type="checkbox" id="yaw_invert">
                    </label>
                </div>
            </div>
        </div>

        <div class="actions">
            <button type="button" id="saveBtn" onclick="saveConfig()">Save PID config</button>
        </div>
        
        <div id="status"></div>

        <div class="actions">
            <button type="button" id="factoryBtn" onclick="initFactory()">Restore factory defaults</button>
        </div>
    </form>
</div>

<script>
    // Synchronise la valeur affichée à côté du slider
    document.querySelectorAll('input[type=range]').forEach(input => {
        const valSpan = document.getElementById(input.id + '_v');
        input.addEventListener('input', () => {
            valSpan.textContent = input.value;
        });
        valSpan.textContent = input.value;
    });

    // Charger la configuration actuelle de l'ESP32 au démarrage
    window.addEventListener('DOMContentLoaded', loadConfig);

    function loadConfig() {
    fetch('/api/config')
        .then(response => response.json())
        .then(data => {
            for (const key in data) {
                const input = document.getElementById(key);
                const valSpan = document.getElementById(key + '_v');

                if (input) {
                    if (input.type === 'checkbox') {
                        input.checked = Boolean(data[key]);
                    } 
                    else {
                        input.value = data[key];
                        if (valSpan) {
                            const step = input.step;
                            if (step && step.includes('.')) {
                                const decimals = step.split('.')[1].length;
                                valSpan.textContent = Number(data[key]).toFixed(decimals);
                            } else {
                                valSpan.textContent = data[key];
                            }
                        }
                    }
                }
            }
        })
        .catch(err => console.log('Utilisation des valeurs par défaut (hors-ligne)'));
    }

    function initFactory() {
        const btn = document.getElementById('factoryBtn');
        const status = document.getElementById('status');

        fetch('/api/pidfactory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(res => {
            if (res.ok) {
                status.className = 'success';
                status.textContent = "Parameters restored!";
            } else {
                throw new Error("Erreur serveur");
            }
        })
        .catch(err => {
            status.className = 'error';
            status.textContent = "Failed to restore parameters.";
        })
        .finally(() => {
            btn.disabled = false;
            setTimeout(() => { status.textContent = ''; }, 4000);
        });
        loadConfig();
    }

    function saveConfig() {
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        status.className = '';
        status.textContent = "Sending config to ESP32...";

        const payload = {
            master_gain: parseInt(document.getElementById('master_gain').value),
            
            roll_kp: parseFloat(document.getElementById('roll_kp').value),
            roll_kd: parseFloat(document.getElementById('roll_kd').value),
            roll_rate: parseFloat(document.getElementById('roll_rate').value),
            roll_invert: document.getElementById('roll_invert').checked,
            
            pitch_kp: parseFloat(document.getElementById('pitch_kp').value),
            pitch_kd: parseFloat(document.getElementById('pitch_kd').value),
            pitch_rate: parseFloat(document.getElementById('pitch_rate').value),
            pitch_invert: document.getElementById('pitch_invert').checked,

            
            yaw_kp: parseFloat(document.getElementById('yaw_kp').value),
            yaw_kd: parseFloat(document.getElementById('yaw_kd').value),
            yaw_rate: parseFloat(document.getElementById('yaw_rate').value),
            yaw_invert: document.getElementById('yaw_invert').checked
        };

        fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (res.ok) {
                status.className = 'success';
                status.textContent = "Parameters saved and applied!";
            } else {
                throw new Error("Erreur serveur");
            }
        })
        .catch(err => {
            status.className = 'error';
            status.textContent = "Failed to save parameters.";
        })
        .finally(() => {
            btn.disabled = false;
            setTimeout(() => { status.textContent = ''; }, 4000);
        });
    }

</script>
</body>
</html>
